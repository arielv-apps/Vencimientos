<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vencimientos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Vencimientos</title>
<style>
:root{--bg:#f4f5f7;--sf:#fff;--tx:#1b1f27;--mu:#586071;--bd:#d6dae1;--ac:#34506f;--acx:#fff;
--rojo:#b3261e;--rojoBg:#fbe8e6;--amb:#7a4d00;--ambBg:#fff0d0;--ver:#1a6638;--verBg:#e2f3e8;--azu:#34506f;--azuBg:#e4eaf2}
@media(prefers-color-scheme:dark){:root{--bg:#13161b;--sf:#1d2128;--tx:#eceef2;--mu:#a3abb9;--bd:#343a46;--ac:#9fb9da;--acx:#0f141b;
--rojo:#ff9d93;--rojoBg:#3b201e;--amb:#ffc968;--ambBg:#3a2e12;--ver:#82d89e;--verBg:#173324;--azu:#9fb9da;--azuBg:#1f2a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 14px) calc(96px + env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 14px)}
h1{font-size:1.6rem;margin:.2em 0 0;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:1.5em 0 .5em}
.mu{color:var(--mu)}
.s-vencido,.s-hoy{--c:var(--rojo);--b:var(--rojoBg)}
.s-urgente{--c:var(--amb);--b:var(--ambBg)}
.s-proximo{--c:var(--azu);--b:var(--azuBg)}
.s-enregla{--c:var(--ver);--b:var(--verBg)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--b);color:var(--c);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:2.4rem;line-height:1}
.card{background:var(--sf);border:1px solid var(--bd);border-left:5px solid var(--c);border-radius:10px;margin:0 0 10px}
.card summary{list-style:none;display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.t{font-weight:650}
.dd{text-align:center;min-width:92px;color:var(--c)}
.dd b{display:block;font-size:1.7rem;line-height:1}
.dd small{display:block;font-size:.78rem;margin-bottom:4px}
.chip{display:inline-block;font-size:.78rem;font-weight:650;background:var(--b);color:var(--c);border:1px solid var(--c);border-radius:99px;padding:1px 8px}
.det{padding:0 12px 12px;border-top:1px solid var(--bd);font-size:.95rem}
.det p{margin:.6em 0 0}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fil{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fil input{grid-column:1/-1}
.fil input,.fil select{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px;min-height:44px;width:100%}
.note{background:var(--ambBg);color:var(--amb);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.92rem}
.note.err{background:var(--rojoBg);color:var(--rojo)}
.note button{margin-left:6px}
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#nav div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{background:none;border:0;padding:8px 2px;min-height:56px;color:var(--mu);cursor:pointer;font-size:.8rem}
#nav button span{display:block;font-size:1.25rem}
#nav button[aria-current=page]{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .w{font-size:.8rem;color:var(--mu)}
.cal button{background:var(--sf);border:1px solid var(--bd);border-radius:8px;min-height:50px;padding:4px 0;cursor:pointer}
.cal button.hoy{border-color:var(--ac);font-weight:700}
.cal button[aria-pressed=true]{background:var(--ac);color:var(--acx)}
.dots{display:flex;gap:3px;justify-content:center;min-height:8px;margin-top:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c);border:1px solid var(--sf)}
.cnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.cnav strong{text-transform:capitalize}
.bar{display:grid;grid-template-columns:150px 1fr 28px;gap:8px;align-items:center;margin:8px 0;font-size:.92rem}
.bt{background:var(--azuBg);border-radius:6px;height:18px}
.bf{background:var(--ac);height:100%;border-radius:6px;min-width:4px}
dialog{max-width:min(92vw,520px);border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx)}
dialog input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;min-height:44px;width:100%}
dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="mu">Cargando vencimientos…</p></main>
<noscript><p>Necesitás activar JavaScript para usar esta app.</p></noscript>
<nav id="nav" aria-label="Secciones"><div>
<button data-v="resumen"><span aria-hidden="true">⌂</span>Resumen</button>
<button data-v="lista"><span aria-hidden="true">☰</span>Lista</button>
<button data-v="cal"><span aria-hidden="true">▦</span>Calendario</button>
<button data-v="mes"><span aria-hidden="true">▥</span>Por mes</button>
</div></nav>
<dialog id="dlg"><div id="dlgc"></div><div class="row"><button class="btn" id="dlgx">Entendido</button></div></dialog>
<dialog id="cfg"><h2>Conexión con la planilla privada</h2><p class="mu">Pegá la URL de la aplicación web de Apps Script y tu código secreto. Se guardan solo en este dispositivo.</p>
<p><label>URL (termina en /exec)<br><input id="cfgu" type="url" autocomplete="off"></label></p>
<p><label>Código secreto<br><input id="cfgt" type="password" autocomplete="off"></label></p>
<p id="cfge" class="note err" hidden></p>
<div class="row"><button class="btn" id="cfgok">Guardar y conectar</button><button class="btn sec" id="cfgdel">Desconectar</button><button class="btn sec" id="cfgx">Cancelar</button></div></dialog>
<div id="toast" role="status"></div>

<script>
// ===== CONFIG (todo lo que se puede querer cambiar está acá) =====
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRZa97NWsGSHmRRrEdocjcPhmxlukPdGKGJ549PITng4D8NXpA7jVQpPyePlLIjP2X0REtf0XKLo8Cj/pub?gid=120297005&single=true&output=csv';
const TZ='America/Argentina/Buenos_Aires';
const UMBRAL_URGENTE=7;   // 1..7 días = Urgente
const UMBRAL_PROXIMO=30;  // 8..30 días = Próximo; más = En regla
const AVISAR_DIAS=7;      // "Avisar al responsable" aparece si vence en <= N días o ya venció
const OCULTAR=['renovado','omitir','pagado'];
const PAGAR_DIAS=30;        // "Marcar pagado" aparece si vence en <= N días o ya venció (solo con planilla privada conectada)
const HORIZONTE_MESES=12;   // cuántos meses a futuro se proyectan los vencimientos repetidos
const CACHE_KEY='venc.rows.v2', NOTIF_KEY='venc.notif.v1', CONN_KEY='venc.conn.v1';

// ==LOGIC== (funciones puras, probadas en test-fechas.js)
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const ALIAS={ms:['vencimiento','fecha','fecha de vencimiento'],prov:['proveedor'],desc:['descripcion'],imp:['importe','monto'],grupo:['grupo','categoria'],estado:['estado'],rep:['repite cada','repite','repeticion']};
function todayLocal(now=new Date()){const p=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(now).split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function parseDate(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/),y,mo,d;
 if(m){d=+m[1];mo=+m[2];y=+m[3]}else if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))){y=+m[1];mo=+m[2];d=+m[3]}else return null;
 const t=Date.UTC(y,mo-1,d),c=new Date(t);return c.getUTCFullYear()===y&&c.getUTCMonth()===mo-1&&c.getUTCDate()===d?t:null}
const daysUntil=(ms,today)=>Math.round((ms-today)/864e5);
function statusOf(d){return d<0?'vencido':d===0?'hoy':d<=UMBRAL_URGENTE?'urgente':d<=UMBRAL_PROXIMO?'proximo':'enregla'}
function addMonths(ms,n,day0){const d=new Date(ms),t=d.getUTCFullYear()*12+d.getUTCMonth()+n,y=Math.floor(t/12),m=t%12,dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();return Date.UTC(y,m,Math.min(day0,dim))}
function parseRepeat(s){const t=norm(s);if(!t)return 0;if(t==='anual')return 12;if(t==='mensual')return 1;if(!/\d|mes|ano|anio/.test(t))return 0;const n=parseInt(t)||1;return /(ano|anos|anio|anios|a)$/.test(t)?n*12:n}
function nextOcc(ms,rep,today){const d0=new Date(ms).getUTCDate();let k=1,n=addMonths(ms,rep,d0);while(n<today&&k<1200){k++;n=addMonths(ms,rep*k,d0)}return n}
function parseImporte(s){if(!s)return null;const n=parseFloat(String(s).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null}
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const r=[];let f='',row=[],q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);r.push(row);row=[];f=''}else f+=c}
 if(f!==''||row.length){row.push(f);r.push(row)}return r}
function buildItems(src){const rows=typeof src==='string'?parseCSV(src):src;if(!rows.length)throw new Error('La planilla llegó vacía.');
 const H=rows[0].map(norm),col={};for(const k in ALIAS)col[k]=H.findIndex(h=>ALIAS[k].includes(h));
 if(col.ms<0||col.prov<0)throw new Error('No encontramos las columnas "Vencimiento" y "Proveedor" en la fila 1 de la planilla.');
 const items=[],bad=[];
 rows.slice(1).forEach((r,n)=>{const g=k=>col[k]>=0?(r[col[k]]||'').trim():'';
  if(!r.some(c=>c.trim()))return;if(OCULTAR.includes(norm(g('estado'))))return;
  const ms=parseDate(g('ms'));if(ms===null){bad.push(n+2);return}
  items.push({id:n,v:g('ms'),ms,prov:g('prov'),desc:g('desc'),title:g('desc')||g('prov'),imp:parseImporte(g('imp')),grupo:g('grupo'),rep:parseRepeat(g('rep'))})});
 return{items,bad}}
function enrich(items,today){return items.map(i=>{const dias=daysUntil(i.ms,today);return{...i,dias,est:statusOf(dias),next:i.rep&&i.ms<=today?nextOcc(i.ms,i.rep,today):null}})
 .sort((a,b)=>a.dias-b.dias||a.title.localeCompare(b.title,'es'))}
function proxFecha(ms,rep,today){return ms>today?addMonths(ms,rep,new Date(ms).getUTCDate()):nextOcc(ms,rep,today)}
function fmtDMY(ms){const d=new Date(ms);return d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()}
function expand(list,today){const out=[],lim=addMonths(today,HORIZONTE_MESES,31);
 list.forEach(i=>{if(!i.rep)return;const d0=new Date(i.ms).getUTCDate();
  for(let k=1;k<1200;k++){const ms=addMonths(i.ms,i.rep*k,d0);if(ms>lim)break;if(ms<today)continue;const dias=daysUntil(ms,today);out.push({...i,ms,dias,est:statusOf(dias),futuro:true,next:null})}});
 return list.concat(out).sort((a,b)=>a.dias-b.dias||a.title.localeCompare(b.title,'es'))}
function groupByMonth(list){const g={};list.forEach(i=>{const k=new Date(i.ms).toISOString().slice(0,7),o=g[k]=g[k]||{k,n:0,total:0,sinImp:0,vencidos:0};
 o.n++;if(i.imp===null)o.sinImp++;else o.total+=i.imp;if(i.dias<0)o.vencidos++});return Object.values(g).sort((a,b)=>a.k<b.k?-1:1)}
// ==/LOGIC==

// ===== UI =====
const $=s=>document.querySelector(s),app=$('#app');
const EST={vencido:{ic:'✕',tx:'Vencido'},hoy:{ic:'!',tx:'Vence hoy'},urgente:{ic:'▲',tx:'Urgente'},proximo:{ic:'◷',tx:'Próximo'},enregla:{ic:'✓',tx:'En regla'}};
const S={items:[],bad:[],view:'resumen',q:'',grupo:'',est:'',cal:null,stale:null,err:null,today:0,last:0,deferred:null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pl=(n,a,b)=>n===1?a:b;
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const fecha=ms=>new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(ms));
const mesNom=(y,m)=>new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m,1)));
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n);
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

function conn(){try{const c=JSON.parse(ls.get(CONN_KEY));return c&&c.url&&c.token?c:null}catch(e){return null}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function dlg(html){$('#dlgc').innerHTML=html;$('#dlg').showModal()}
$('#dlgx').onclick=()=>$('#dlg').close();
$('#cfgx').onclick=()=>$('#cfg').close();
$('#cfgdel').onclick=()=>{try{localStorage.removeItem(CONN_KEY);localStorage.removeItem(CACHE_KEY)}catch(e){}$('#cfg').close();S.raw=[];load()};
$('#cfgok').onclick=()=>{const u=$('#cfgu').value.trim(),k=$('#cfgt').value.trim(),er=$('#cfge');
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)||k.length<16){er.textContent='Revisá la URL (debe terminar en /exec) y pegá el código secreto completo.';er.hidden=false;return}
 ls.set(CONN_KEY,JSON.stringify({url:u,token:k}));try{localStorage.removeItem(CACHE_KEY)}catch(e){}$('#cfg').close();S.raw=[];load()};

function recompute(){S.today=todayLocal();S.items=enrich(S.raw||[],S.today);S.occ=expand(S.items,S.today);
 if(!S.cal){const d=new Date(S.today);S.cal={y:d.getUTCFullYear(),m:d.getUTCMonth(),sel:S.today}}}

function btns(i){const b=(i.dias<=AVISAR_DIAS?`<button class="btn" data-act="avisar" data-id="${i.id}">Avisar al responsable</button>`:'')+
 (conn()&&i.dias<=PAGAR_DIAS?`<button class="btn sec" data-act="pagar" data-id="${i.id}">${i.rep?'Pagado: pasar a la próxima fecha':'Marcar como pagado'}</button>`:'');return b?`<div class="row">${b}</div>`:''}
function card(i){const e=EST[i.est],a=Math.abs(i.dias),u=pl(a,'día','días')+(i.dias<0?' de atraso':'');
 return `<details class="card s-${i.est}"><summary><div><div class="t">${esc(i.title)}${i.futuro?' <span class="mu">(repetición)</span>':''}</div><div class="mu">${fecha(i.ms)}</div><div class="mu">${esc(i.grupo||'Sin grupo')}</div></div>
 <div class="dd">${i.dias===0?'<b>Hoy</b>':`<b>${a}</b><small>${u}</small>`}<span class="chip"><span aria-hidden="true">${e.ic}</span> ${e.tx}</span></div></summary>
 <div class="det">${i.desc&&i.prov&&i.desc!==i.prov?`<p><b>Proveedor:</b> ${esc(i.prov)}</p>`:''}
 ${i.imp!==null?`<p><b>Importe:</b> ${money(i.imp)}</p>`:''}
 ${i.rep?`<p><b>Se repite</b> cada ${i.rep%12===0?i.rep/12+pl(i.rep/12,' año',' años'):i.rep+pl(i.rep,' mes',' meses')}.</p>`:''}
 ${i.next?`<p><b>Próxima fecha:</b> ${fecha(i.next)} (en ${daysUntil(i.next,S.today)} días)</p>`:''}
 ${i.futuro?'<p class="mu">Repetición futura calculada con "Repite cada". Todavía no figura como fila en la planilla.</p>':btns(i)}</div></details>`}

const V={
resumen(){const v=S.items.filter(i=>i.dias<0).length,w=S.items.filter(i=>i.dias>=0&&i.dias<=UMBRAL_URGENTE).length,top=S.items[0];
 const perm='Notification' in window?Notification.permission:'no';
 return `<h1>Vencimientos</h1><div class="mu">Hoy es ${fecha(S.today)}</div>
 <div class="kpis"><div class="kpi s-vencido"><b>${v}</b>${pl(v,'vencido','vencidos')}</div><div class="kpi s-urgente"><b>${w}</b>vencen en ${UMBRAL_URGENTE} días o menos</div></div>
 <h2>Lo más urgente</h2>${top?card(top):'<p>No hay vencimientos cargados. Agregá filas en la planilla y tocá Actualizar.</p>'}
 ${isIOS&&!standalone()?`<div class="note">En iPhone los avisos solo funcionan con la app instalada. <button class="btn sec" data-act="inst">Ver cómo instalarla</button></div>`:''}
 <h2>Ajustes</h2><div class="row">
 <button class="btn" data-act="refresh">Actualizar</button>
 ${perm==='default'?'<button class="btn sec" data-act="perm">Activar avisos</button>':''}
 ${perm==='granted'?'<button class="btn sec" data-act="test">Probar aviso</button>':''}
 <button class="btn sec" data-act="lim">¿Cómo funcionan los avisos?</button>
 <button class="btn sec" data-act="conn">${conn()?'Conexión con la planilla':'Conectar planilla privada'}</button>
 <button class="btn sec" data-act="share">Compartir app</button>
 <button class="btn sec" data-act="inst">Cómo instalarla</button></div>
 <p class="mu">Fuente de datos: ${conn()?'planilla privada (Apps Script)':'planilla publicada (CSV)'}.</p>
 ${perm==='denied'?'<p class="mu">Bloqueaste los avisos. Habilitalos desde los ajustes del navegador o de la app instalada.</p>':''}`},
lista(){const gs=[...new Set(S.items.map(i=>i.grupo).filter(Boolean))].sort();
 return `<h1>Lista</h1><div class="fil"><input id="q" type="search" placeholder="Buscar proveedor o descripción" aria-label="Buscar" value="${esc(S.q)}">
 <select id="fg" aria-label="Filtrar por grupo"><option value="">Todos los grupos</option>${gs.map(g=>`<option ${g===S.grupo?'selected':''}>${esc(g)}</option>`).join('')}</select>
 <select id="fe" aria-label="Filtrar por estado"><option value="">Todos los estados</option>${Object.keys(EST).map(k=>`<option value="${k}" ${k===S.est?'selected':''}>${EST[k].tx}</option>`).join('')}</select></div><div id="lst">${listaHtml()}</div>`},
cal(){const {y,m,sel}=S.cal,dow=new Date(Date.UTC(y,m,1)).getUTCDay(),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
 let c='';for(let i=0;i<dow;i++)c+='<span></span>';
 for(let d=1;d<=dim;d++){const ms=Date.UTC(y,m,d),its=S.occ.filter(i=>i.ms===ms);
  c+=`<button data-act="day" data-d="${ms}" aria-pressed="${ms===sel}" class="${ms===S.today?'hoy':''}" aria-label="${d}${its.length?`, ${its.length} ${pl(its.length,'vencimiento','vencimientos')}`:''}">${d}<div class="dots">${its.slice(0,3).map(i=>`<i class="s-${i.est}"></i>`).join('')}</div></button>`}
 const day=S.occ.filter(i=>i.ms===sel);
 return `<h1>Calendario</h1><div class="cnav"><button class="btn sec" data-act="mm" data-n="-1" aria-label="Mes anterior">‹</button><strong>${mesNom(y,m)}</strong><button class="btn sec" data-act="mm" data-n="1" aria-label="Mes siguiente">›</button></div>
 <div class="cal">${['D','L','M','M','J','V','S'].map(x=>`<span class="w" aria-hidden="true">${x}</span>`).join('')}${c}</div>
 <h2>${fecha(sel)}</h2>${day.length?day.map(card).join(''):'<p class="mu">No hay vencimientos este día.</p>'}`},
mes(){const g=groupByMonth(S.occ),mx=Math.max(1,...g.map(o=>o.n));
 return `<h1>Por mes</h1><p class="mu">Vencimientos e importes de cada mes, con los repetidos de los próximos ${HORIZONTE_MESES} meses.</p>`+(g.map(o=>{const [y,m]=o.k.split('-').map(Number);
  return `<div class="bar"><div>${mesNom(y,m-1)}<br><small>${money(o.total)}${o.sinImp?` + ${o.sinImp} sin importe`:''}${o.vencidos?' · hay vencidos':''}</small></div><div class="bt"><div class="bf" style="width:${o.n/mx*100}%"></div></div><b>${o.n}</b></div>`}).join('')||'<p>No hay datos.</p>')}
};
function listaHtml(){const q=norm(S.q),r=S.items.filter(i=>(!S.grupo||i.grupo===S.grupo)&&(!S.est||i.est===S.est)&&(!q||norm(i.title+' '+i.prov+' '+i.grupo).includes(q)));
 return r.length?r.map(card).join(''):'<p class="mu">No hay resultados. Probá con otro filtro o borrá la búsqueda.</p>'}

function render(){let b='';
 if(S.err)b+=`<div class="note err"><b>No pudimos cargar la planilla.</b> ${esc(S.err)} Revisá tu conexión y tocá Actualizar. Si sigue fallando, confirmá que la hoja siga publicada (Archivo › Compartir › Publicar en la Web, formato CSV). <div class="row"><button class="btn" data-act="refresh">Actualizar</button>${conn()?'<button class="btn sec" data-act="conn">Conexión</button>':''}</div></div>`;
 if(S.stale)b+=`<div class="note">No pudimos actualizar. Mostramos la copia guardada del ${new Date(S.stale).toLocaleString('es-AR',{timeZone:TZ})}. Revisá tu conexión y tocá Actualizar en el Resumen.</div>`;
 if(S.bad.length)b+=`<div class="note">Descartamos ${S.bad.length} ${pl(S.bad.length,'fila','filas')} con fecha inválida (fila ${S.bad.join(', ')}). Corregí el formato a d/m/aaaa en la planilla. <button class="btn sec" data-act="dismiss">Cerrar</button></div>`;
 app.innerHTML=b+(S.items.length||!S.err?V[S.view]():'');
 document.querySelectorAll('#nav button').forEach(x=>x.dataset.v===S.view?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current'))}

async function get(u,sig){try{return await fetch(u,{signal:sig})}catch(e1){if(e1.name==='AbortError')throw e1;return await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now(),{credentials:'omit',referrerPolicy:'no-referrer',signal:sig})}}
async function load(){S.last=Date.now();const c=conn();let rows,res;
 try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),15000);
  const r=await get(c?c.url+'?token='+encodeURIComponent(c.token):CSV_URL,ac.signal);clearTimeout(to);
  if(!r.ok)throw new Error('Google respondió '+r.status+'.');const tx=await r.text();
  if(c){let j;try{j=JSON.parse(tx)}catch(_){throw new Error('La respuesta del script no es válida. Revisá que la implementación tenga acceso "Cualquier persona" y que la URL termine en /exec.')}
   if(!j.ok)throw new Error((j.error||'El script rechazó el pedido.')+' Revisá la conexión en Ajustes.');rows=j.values}else rows=parseCSV(tx);
  res=buildItems(rows);ls.set(CACHE_KEY,JSON.stringify({rows,ts:Date.now()}));S.stale=null;S.err=null}
 catch(e){S.err=null;const raw=ls.get(CACHE_KEY);
  if(raw){try{const o=JSON.parse(raw);res=buildItems(o.rows);S.stale=o.ts}catch(_){}}
  if(!res)S.err=e.name==='AbortError'?'La descarga tardó demasiado.':e instanceof TypeError?'El navegador no pudo descargarla (conexión, bloqueador de anuncios, o archivo abierto desde el disco en vez de la web publicada).':e.message||'Error de red.'}
 if(res){S.raw=res.items;S.bad=res.bad}
 recompute();render();avisoDiario()}
async function pagar(id){const i=S.items.find(x=>x.id===id),c=conn();if(!i||!c)return;
 const nueva=i.rep?proxFecha(i.ms,i.rep,S.today):null;
 if(!confirm(nueva?`¿Marcar "${i.title}" como pagado y pasar el vencimiento al ${fecha(nueva)}?`:`¿Marcar "${i.title}" como pagado? Va a dejar de aparecer en la lista.`))return;
 try{const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:c.token,accion:nueva?'avanzar':'pagar',row:i.id+2,prov:i.prov,venc:i.v,nuevo:nueva?fmtDMY(nueva):null})});
  const j=JSON.parse(await r.text());if(!j.ok)throw new Error(j.error||'El script rechazó el cambio.');toast('Listo: se actualizó la planilla');load()}
 catch(e){dlg(`<h2>No pudimos confirmar el cambio</h2><p>${esc(e.message)}</p><p>Tocá Actualizar en el Resumen para ver si se guardó, y si no, probá de nuevo.</p>`)}}
async function notify(t,b){try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)return await reg.showNotification(t,{body:b,icon:'icon-192.png',tag:'venc'});new Notification(t,{body:b})}catch(e){toast('No se pudo mostrar el aviso.')}}
function avisoDiario(){if(!('Notification' in window)||Notification.permission!=='granted')return;
 const k=new Date(S.today).toISOString().slice(0,10);if(ls.get(NOTIF_KEY)===k)return;
 const v=S.items.filter(i=>i.dias<0).length,h=S.items.filter(i=>i.dias===0).length;if(!v&&!h)return;
 ls.set(NOTIF_KEY,k);notify('Vencimientos',`Tenés ${v} ${pl(v,'vencido','vencidos')} y ${h} que ${pl(h,'vence','vencen')} hoy.`)}
async function avisar(id){const i=S.items.find(x=>x.id===id);if(!i)return;
 const w=i.dias<0?`venció hace ${-i.dias} ${pl(-i.dias,'día','días')}`:i.dias===0?'vence hoy':`vence en ${i.dias} ${pl(i.dias,'día','días')}`;
 const text=`${i.title}${i.grupo?' ('+i.grupo+')':''} ${w}: ${fecha(i.ms)}.`;
 try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);toast('Mensaje copiado')}}catch(e){}}
async function compartir(){const url=location.origin+location.pathname;
 try{if(navigator.share)await navigator.share({title:'Vencimientos',text:'Mi app de vencimientos',url});else{await navigator.clipboard.writeText(url);toast('Enlace copiado')}}catch(e){}}
const INSTALL=()=>`<h2>Instalar la app</h2><p><b>iPhone (Safari, iOS 16.4 o superior):</b> tocá Compartir, elegí "Agregar a pantalla de inicio" y abrí la app desde ese ícono. Sin este paso, iOS no permite avisos.</p><p><b>Android (Chrome):</b> tocá el menú ⋮ y elegí "Instalar app" o "Agregar a pantalla de inicio".</p>${S.deferred?'<div class="row"><button class="btn" id="instNow">Instalar ahora</button></div>':''}`;
const LIM=`<h2>Cómo funcionan los avisos</h2><p>Esta app no tiene servidor, así que <b>solo puede avisarte cuando la abrís</b>: una vez por día, si tenés algo vencido o que vence hoy. Con la app cerrada no llega nada.</p><p>Para recibir avisos sin abrir la app, usá el script de email (apps-script.gs).</p>`;

app.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='refresh')load();
 else if(a==='perm'){if('Notification' in window)await Notification.requestPermission();render()}
 else if(a==='test'){if(isIOS&&!standalone())dlg(INSTALL());else notify('Aviso de prueba','Así te vamos a avisar cuando abras la app.')}
 else if(a==='share')compartir();
 else if(a==='inst'){dlg(INSTALL());const n=$('#instNow');if(n)n.onclick=()=>{S.deferred.prompt();$('#dlg').close()}}
 else if(a==='lim')dlg(LIM);
 else if(a==='pagar')pagar(+b.dataset.id);
 else if(a==='conn'){const c=conn();$('#cfgu').value=c?c.url:'';$('#cfgt').value=c?c.token:'';$('#cfge').hidden=true;$('#cfg').showModal()}
 else if(a==='avisar')avisar(+b.dataset.id);
 else if(a==='dismiss'){S.bad=[];render()}
 else if(a==='day'){S.cal.sel=+b.dataset.d;render()}
 else if(a==='mm'){const t=S.cal.y*12+S.cal.m+ +b.dataset.n;S.cal.y=Math.floor(t/12);S.cal.m=t%12;render()}});
app.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;$('#lst').innerHTML=listaHtml()}});
app.addEventListener('change',e=>{if(e.target.id==='fg'){S.grupo=e.target.value}else if(e.target.id==='fe'){S.est=e.target.value}else return;$('#lst').innerHTML=listaHtml()});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;S.view=b.dataset.v;render();scrollTo(0,0)});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.deferred=e});
// Recalcular al volver a la app (cambia el día, o pasó un rato)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;
 if(Date.now()-S.last>5*60e3)load();else{recompute();render();avisoDiario()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
